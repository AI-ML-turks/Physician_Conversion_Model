# This is a basic workflow to help you get started with Actions

name: Physician Conversion Model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "Feature_Engineering_Pipeline"
  Feature_Engineering_Pipeline:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Repo Checkout
        uses: actions/checkout@v2

      - name: Python Setup & Packages Installation
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Jupyter Notebook Execution
        run: jupyter execute feature_eng_pipeline.ipynb
        shell: bash

  Inference_Pipeline:
    runs-on: ubuntu-latest
    needs: Feature_Engineering_Pipeline
    steps:
      - name: Clone repository
        uses: actions/checkout@v2
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt
          
      - name: Jupyter Notebook Execution
        run: jupyter execute Inference_pipeline.ipynb
        shell: bash
